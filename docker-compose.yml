services:
  ## --- HADOOP HDFS (NAMENODE) ---
  namenode:
    image: apache/hadoop:3.4.0
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    command: >
      bash -c "
      echo '<configuration><property><name>fs.defaultFS</name><value>hdfs://namenode:9000</value></property></configuration>' > /opt/hadoop/etc/hadoop/core-site.xml &&
      echo '<configuration><property><name>dfs.namenode.rpc-address</name><value>namenode:9000</value></property></configuration>' > /opt/hadoop/etc/hadoop/hdfs-site.xml &&
      if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then hdfs namenode -format -force; fi &&
      hdfs namenode"
    volumes:
      - hadoop_namenode:/tmp/hadoop-root/dfs/name
    networks:
      - bigdata-net

  # --- HADOOP HDFS (DATANODE) ---
  datanode:
    image: apache/hadoop:3.4.0
    container_name: datanode
    hostname: datanode
    depends_on:
      - namenode
    command: >
      bash -c "
      echo '<configuration><property><name>fs.defaultFS</name><value>hdfs://namenode:9000</value></property></configuration>' > /opt/hadoop/etc/hadoop/core-site.xml &&
      hdfs datanode"
    volumes:
      - hadoop_datanode:/tmp/hadoop-root/dfs/data
    networks:
      - bigdata-net
  # --- SPARK MASTER ---
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    networks:
      - bigdata-net

  # --- SPARK WORKER ---
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    networks:
      - bigdata-net

  # --- KAFKA ---
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bigdata-net

  # --- MONGO DB 7.0 ---
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bigdata-net

  # --- POSTGRES SQL ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bigdata_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bigdata-net


  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ventas_db
      MYSQL_USER: sqoopuser
      MYSQL_PASSWORD: sqooppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bigdata-net

  # --- JUPYTER ---
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter
    ports:
      - "8888:8888"
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./shared-data:/home/jovyan/shared-data
    networks:
      - bigdata-net

  # --- ANACONDA ---
  anaconda:
    image: continuumio/anaconda3:2024.02-1
    container_name: anaconda_env
    restart: unless-stopped
    tty: true
    stdin_open: true
    command: /bin/bash -c "jupyter notebook --notebook-dir=/workspace --ip=0.0.0.0 --port=8889 --no-browser --allow-root --NotebookApp.token=''"
    ports:
      - "8889:8889"
    volumes:
      - ./anaconda_workspace:/workspace
    networks:
      - bigdata-net


  

networks:
  bigdata-net:
    name: bigdata-network
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode:
  kafka_data:
  mongo_data:
  postgres_data:
  mysql_data: